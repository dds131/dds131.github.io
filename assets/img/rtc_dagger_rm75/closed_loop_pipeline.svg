<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">RTC 与 DAgger 双域闭环</title><desc id="desc">采集部署端完成自主、接管与记录，训练端完成转换、聚合、训练并回传权重</desc>
  <defs><linearGradient id="pbg" x1="0" x2="1"><stop stop-color="#eaf8f5"/><stop offset="1" stop-color="#f0f2ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60707a"/></marker></defs>
  <style>.t{font:700 19px system-ui,sans-serif;fill:#17313b}.s{font:14px system-ui,sans-serif;fill:#536a74}.n{font:800 13px system-ui,sans-serif;fill:white}.box{fill:white;stroke:#b7c8cc;stroke-width:1.6}.hi{stroke:#0e9384;stroke-width:2.5}.tr{stroke:#5865d8;stroke-width:2.5}.ar{fill:none;stroke:#60707a;stroke-width:2;marker-end:url(#a)}.lane{fill:url(#pbg);stroke:#cad8db}</style>
  <rect width="1100" height="560" rx="24" fill="#f8fbfb"/>
  <rect class="lane" x="35" y="58" width="1030" height="198" rx="22"/><text class="t" x="64" y="94">采集 / 部署域</text>
  <rect class="lane" x="35" y="303" width="1030" height="198" rx="22"/><text class="t" x="64" y="339">训练域</text>
  <g><rect class="box hi" x="75" y="124" width="180" height="88" rx="14"/><circle cx="100" cy="147" r="13" fill="#0e9384"/><text class="n" x="100" y="152" text-anchor="middle">1</text><text class="t" x="165" y="160" text-anchor="middle">RTC 自主</text><text class="s" x="165" y="187" text-anchor="middle">异步动作块执行</text>
  <rect class="box" x="310" y="124" width="180" height="88" rx="14"/><circle cx="335" cy="147" r="13" fill="#d18b25"/><text class="n" x="335" y="152" text-anchor="middle">2</text><text class="t" x="400" y="160" text-anchor="middle">VR 接管</text><text class="s" x="400" y="187" text-anchor="middle">完整恢复 · 门控录制</text>
  <rect class="box" x="545" y="124" width="180" height="88" rx="14"/><circle cx="570" cy="147" r="13" fill="#5865d8"/><text class="n" x="570" y="152" text-anchor="middle">3</text><text class="t" x="635" y="160" text-anchor="middle">原始记录</text><text class="s" x="635" y="187" text-anchor="middle">NPZ · 三路视频 · Meta</text>
  <rect class="box" x="780" y="124" width="230" height="88" rx="14"/><circle cx="805" cy="147" r="13" fill="#5865d8"/><text class="n" x="805" y="152" text-anchor="middle">4</text><text class="t" x="895" y="160" text-anchor="middle">归档 + SHA-256</text><text class="s" x="895" y="187" text-anchor="middle">传输完整性与临时落点</text></g>
  <g><rect class="box tr" x="150" y="368" width="190" height="88" rx="14"/><circle cx="175" cy="391" r="13" fill="#5865d8"/><text class="n" x="175" y="396" text-anchor="middle">5</text><text class="t" x="245" y="404" text-anchor="middle">转换 + 校验</text><text class="s" x="245" y="431" text-anchor="middle">参考 Schema 真相源</text>
  <rect class="box" x="415" y="368" width="190" height="88" rx="14"/><circle cx="440" cy="391" r="13" fill="#5865d8"/><text class="n" x="440" y="396" text-anchor="middle">6</text><text class="t" x="510" y="404" text-anchor="middle">物理聚合</text><text class="s" x="510" y="431" text-anchor="middle">原始集 + 纠正集</text>
  <rect class="box" x="680" y="368" width="190" height="88" rx="14"/><circle cx="705" cy="391" r="13" fill="#0e9384"/><text class="n" x="705" y="396" text-anchor="middle">7</text><text class="t" x="775" y="404" text-anchor="middle">全参续训</text><text class="s" x="775" y="431" text-anchor="middle">任务权重起点 · 小步验证</text></g>
  <path class="ar" d="M255 168h50"/><path class="ar" d="M490 168h50"/><path class="ar" d="M725 168h50"/><path class="ar" d="M895 212v105c0 26-40 39-82 39H340"/><path class="ar" d="M340 412h70"/><path class="ar" d="M605 412h70"/><path class="ar" d="M775 368V278c0-24-38-34-80-34H270"/>
  <text class="s" x="420" y="276">新 checkpoint 校验后回传，重启 RTC 服务端进入下一轮</text>
</svg>

