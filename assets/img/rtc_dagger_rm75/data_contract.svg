<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">纠正数据契约与训练映射</title><desc id="desc">状态、动作、三路图像、干预标签和任务字段从采集记录转换为 LeRobot 数据集</desc>
  <defs><marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5d7079"/></marker></defs>
  <style>.t{font:750 18px system-ui,sans-serif;fill:#17313b}.s{font:13px system-ui,sans-serif;fill:#536a74}.m{font:700 14px ui-monospace,monospace;fill:#24434a}.box{fill:#fff;stroke:#b7c7cb;stroke-width:1.6}.hi{stroke:#0e9384;stroke-width:2.5}.p{stroke:#5865d8;stroke-width:2.5}.a{fill:none;stroke:#5d7079;stroke-width:2;marker-end:url(#da)}.warn{fill:#fff9ee;stroke:#d18b25}</style>
  <rect width="1100" height="520" rx="22" fill="#f8fbfb"/>
  <text class="t" x="65" y="58">采集语义</text><text class="t" x="432" y="58">LeRobot 原始键</text><text class="t" x="815" y="58">训练期映射 / 处理</text>
  <g><rect class="box hi" x="55" y="84" width="260" height="74" rx="13"/><text class="m" x="75" y="116">state: float32[8]</text><text class="s" x="75" y="140">7 关节实测角 + 夹爪连续开口</text>
  <rect class="box hi" x="55" y="176" width="260" height="74" rx="13"/><text class="m" x="75" y="208">action: float32[8]</text><text class="s" x="75" y="232">安全链后绝对目标 + 夹爪三档</text>
  <rect class="box" x="55" y="268" width="260" height="92" rx="13"/><text class="m" x="75" y="300">images: 3 × 224² × 3</text><text class="s" x="75" y="325">head · arm · third</text><text class="s" x="75" y="346">30 Hz，对齐状态和动作</text>
  <rect class="box" x="55" y="378" width="260" height="74" rx="13"/><text class="m" x="75" y="410">intervention + task</text><text class="s" x="75" y="434">人工来源标记 + 语言任务</text></g>
  <g><rect class="box p" x="400" y="84" width="300" height="74" rx="13"/><text class="m" x="420" y="128">observation.state</text>
  <rect class="box p" x="400" y="176" width="300" height="74" rx="13"/><text class="m" x="420" y="220">action</text>
  <rect class="box p" x="400" y="268" width="300" height="92" rx="13"/><text class="m" x="420" y="302">observation.images.head_camera</text><text class="m" x="420" y="326">...arm_camera / third_camera</text>
  <rect class="box p" x="400" y="378" width="300" height="74" rx="13"/><text class="m" x="420" y="410">intervention: bool[1]</text><text class="m" x="420" y="434">task: string</text></g>
  <g><rect class="box" x="780" y="84" width="265" height="74" rx="13"/><text class="t" x="912" y="115" text-anchor="middle">归一化 + 相对动作</text><text class="s" x="912" y="139" text-anchor="middle">关节维处理；夹爪排除</text>
  <rect class="box" x="780" y="176" width="265" height="74" rx="13"/><text class="t" x="912" y="207" text-anchor="middle">行为克隆目标</text><text class="s" x="912" y="231" text-anchor="middle">数据集内仍保存绝对动作</text>
  <rect class="warn" x="780" y="268" width="265" height="92" rx="13"/><text class="t" x="912" y="300" text-anchor="middle">rename_map</text><text class="s" x="912" y="326" text-anchor="middle">base_0_rgb · wrist slots</text><text class="s" x="912" y="348" text-anchor="middle">只在训练入口映射</text>
  <rect class="box" x="780" y="378" width="265" height="74" rx="13"/><text class="t" x="912" y="410" text-anchor="middle">来源审计</text><text class="s" x="912" y="434" text-anchor="middle">BC 不等于自动按 intervention 加权</text></g>
  <path class="a" d="M315 121h80"/><path class="a" d="M315 213h80"/><path class="a" d="M315 314h80"/><path class="a" d="M315 415h80"/><path class="a" d="M700 121h75"/><path class="a" d="M700 213h75"/><path class="a" d="M700 314h75"/><path class="a" d="M700 415h75"/>
  <text class="s" x="550" y="492" text-anchor="middle">参考数据集 meta/info.json 是字段、尺寸、dtype、fps 与 robot_type 的运行时真相源</text>
</svg>

