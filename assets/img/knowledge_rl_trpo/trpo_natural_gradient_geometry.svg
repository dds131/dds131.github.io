<svg xmlns="http://www.w3.org/2000/svg" width="880" height="434" viewBox="0 0 880 434" role="img" aria-label="二维参数空间中信任域几何的示意图。Fisher 矩阵取对角阵 diag(4, 0.25)，梯度取 (1, 1)，信任域半径 δ = 0.02。主题色椭圆是 KL 约束确定的信任域，横半轴 0.1、纵半轴 0.4，说明第一个方向上策略对参数变化敏感、第二个方向上迟钝。虚线圆是同样体量的欧氏约束。黑色箭头是普通梯度方向走到椭圆边界的更新，预测提升 0.194；主题色箭头是自然梯度方向走到椭圆边界的更新，预测提升 0.412，是前者的 2.125 倍。">
  <defs>
    <style>
      .t3q-ell{fill:var(--global-theme-color,#b509ac);fill-opacity:.09;stroke:var(--global-theme-color,#b509ac);stroke-width:1.8}
      .t3q-ball{fill:none;stroke:currentColor;stroke-width:1.3;stroke-dasharray:6 4;opacity:.45}
      .t3q-axis{stroke:currentColor;opacity:.35;stroke-width:1;fill:none}
      .t3q-gvec{stroke:currentColor;stroke-width:2.2;fill:none;marker-end:url(#t3qarrow)}
      .t3q-nvec{stroke:var(--global-theme-color,#b509ac);stroke-width:2.6;fill:none;marker-end:url(#t3qarrowp)}
      .t3q-dot{fill:currentColor}
      .t3q-t{font-size:12.5px;fill:currentColor;font-weight:600}
      .t3q-s{font-size:11.5px;fill:currentColor;opacity:.82}
      .t3q-g{font-size:12px;fill:var(--global-theme-color,#b509ac)}
      .t3q-l{font-size:11.5px;fill:currentColor;opacity:.7}
    </style>
    <marker id="t3qarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="t3qarrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--global-theme-color,#b509ac)"/>
    </marker>
  </defs>
<path class="t3q-axis" d="M240.0,215.0 L560.0,215.0"/>
<path class="t3q-axis" d="M300.0,295.0 L300.0,15.0"/>
<text class="t3q-l" x="564.0" y="219.0">θ₁</text>
<text class="t3q-l" x="306.0" y="9.0">θ₂</text>
<circle class="t3q-ball" cx="300.0" cy="215.0" r="80.0"/>
<ellipse class="t3q-ell" cx="300.0" cy="215.0" rx="40.0" ry="160.0"/>
<circle class="t3q-dot" cx="300.0" cy="215.0" r="3.5"/>
<text class="t3q-s" x="246.0" y="235.0">θ_old</text>
<path class="t3q-gvec" d="M300.0,215.0 L338.8,176.2"/>
<path class="t3q-nvec" d="M300.0,215.0 L309.7,59.8"/>
<text class="t3q-t" x="348.8" y="180.2">普通梯度方向</text>
<text class="t3q-s" x="348.8" y="198.2">预测提升 0.194</text>
<text class="t3q-g" x="321.7" y="63.8">自然梯度方向 H⁻¹g</text>
<text class="t3q-g" x="321.7" y="81.8">预测提升 0.412，是前者的 2.125 倍</text>
<text class="t3q-s" x="600" y="300">Fisher H = diag(4, 0.25)，梯度 g = (1, 1)，δ = 0.02</text>
<text class="t3q-s" x="600" y="322">椭圆：½ΔᵀHΔ = δ，半轴 0.1 与 0.4</text>
<text class="t3q-s" x="600" y="344">虚线圆：½‖Δ‖² = δ，半径 0.2</text>
<text class="t3q-l" x="60" y="424">θ₁ 方向上策略对参数敏感（Fisher 大），信任域窄；θ₂ 方向迟钝（Fisher 小），信任域宽。</text>
</svg>
