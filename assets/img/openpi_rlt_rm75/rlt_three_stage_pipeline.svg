<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">openpi-RLT 三阶段训练流水线</title>
  <desc id="desc">展示 π0.5 行为克隆、RL Token 表征训练与在线 Actor-Critic 三个阶段各自的训练对象、冻结对象、产物和验收指标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfc"/><stop offset="1" stop-color="#eef0ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a8f82"/><stop offset="1" stop-color="#6657c8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4d6e75"/></marker>
    <style>
      .t{font-family:system-ui,sans-serif;fill:#132a31}.h{font-size:28px;font-weight:760}.s{font-size:20px}.m{font-size:18px;fill:#51666d}.tag{font-size:16px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <rect x="55" y="42" width="1290" height="74" rx="20" fill="url(#head)"/>
  <text x="700" y="90" text-anchor="middle" class="t" fill="#fff" font-size="32" font-weight="780">从示范学习到真机在线强化学习：三个训练边界</text>
  <g transform="translate(65 170)">
    <rect width="370" height="410" rx="24" fill="#fff" stroke="#34a99c" stroke-width="3"/>
    <rect x="24" y="24" width="112" height="34" rx="17" fill="#168f83"/><text x="80" y="47" text-anchor="middle" class="t tag">阶段 ①</text>
    <text x="24" y="102" class="t h">π0.5 全参 SFT</text>
    <text x="24" y="144" class="t s">输入</text><text x="120" y="144" class="t m">1393 条三相机示范</text>
    <text x="24" y="185" class="t s">训练</text><text x="120" y="185" class="t m">完整 VLA</text>
    <text x="24" y="226" class="t s">输出</text><text x="120" y="226" class="t m">任务 BC 检查点</text>
    <line x1="24" y1="256" x2="346" y2="256" stroke="#d7e2e4"/>
    <text x="24" y="302" class="t m">8 卡 · batch 256</text>
    <text x="24" y="340" class="t m">选择 step 40000</text>
    <text x="24" y="384" class="t h" fill="#0a8f82">92%</text>
    <text x="126" y="384" class="t m">既有平滑链路成绩</text>
    <path d="M380 205H455" stroke="#4d6e75" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(500 170)">
    <rect width="400" height="410" rx="24" fill="#fff" stroke="#6a5ccc" stroke-width="3"/>
    <rect x="24" y="24" width="112" height="34" rx="17" fill="#6657c8"/><text x="80" y="47" text-anchor="middle" class="t tag">阶段 ②</text>
    <text x="24" y="102" class="t h">RL-Token Stage-1</text>
    <text x="24" y="144" class="t s">输入</text><text x="126" y="144" class="t m">prefix [768,2048]</text>
    <text x="24" y="185" class="t s">训练</text><text x="126" y="185" class="t m">encoder / decoder</text>
    <text x="24" y="226" class="t s">冻结</text><text x="126" y="226" class="t m">完整 π0.5</text>
    <text x="24" y="267" class="t s">输出</text><text x="126" y="267" class="t m">z_rl [1,2048]</text>
    <line x1="24" y1="292" x2="376" y2="292" stroke="#d7e2e4"/>
    <text x="24" y="333" class="t m">11999 步 · batch 128</text>
    <text x="24" y="374" class="t h" fill="#6657c8">MSE 0.1628</text>
    <path d="M410 205H485" stroke="#4d6e75" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(965 170)">
    <rect width="370" height="410" rx="24" fill="#fff" stroke="#d08331" stroke-width="3"/>
    <rect x="24" y="24" width="112" height="34" rx="17" fill="#c87420"/><text x="80" y="47" text-anchor="middle" class="t tag">阶段 ③</text>
    <text x="24" y="102" class="t h">在线 Actor-Critic</text>
    <text x="24" y="144" class="t s">输入</text><text x="126" y="144" class="t m">z_rl + proprio + ref</text>
    <text x="24" y="185" class="t s">训练</text><text x="126" y="185" class="t m">Actor + Twin Critic</text>
    <text x="24" y="226" class="t s">冻结</text><text x="126" y="226" class="t m">π0.5 + RL Token</text>
    <line x1="24" y1="256" x2="346" y2="256" stroke="#d7e2e4"/>
    <text x="24" y="302" class="t m">E-2 → F → G → L4</text>
    <text x="24" y="340" class="t m">在线系统与训练均健康</text>
    <text x="24" y="384" class="t h" fill="#bb5a2a">增益 0</text>
  </g>
  <rect x="230" y="626" width="940" height="52" rx="16" fill="#162d35"/>
  <text x="700" y="660" text-anchor="middle" class="t" fill="#fff" font-size="21">每一段“跑通”的验收对象不同：接口完整 ≠ 表征有效 ≠ 任务成功率提升</text>
</svg>
