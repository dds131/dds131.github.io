<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">RL-Token Stage-1 重建 MSE 收敛</title>
  <desc id="desc">MSE 从 step 0 的 21.3977 下降到 step 400 的 0.4493，并在 step 11999 达到 0.1628。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#f2f0fb"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a9888"/><stop offset="1" stop-color="#6657c8"/></linearGradient>
    <style>.t{font-family:system-ui,sans-serif;fill:#19333b}.h{font-size:31px;font-weight:780}.s{font-size:18px;fill:#5a6d72}.v{font-size:19px;font-weight:720}</style>
  </defs>
  <rect width="1200" height="660" rx="26" fill="url(#bg)"/>
  <text x="68" y="68" class="t h">RL-Token 重建 MSE · 对数纵轴</text>
  <text x="68" y="101" class="t s">训练指标用于验收表征重建，不等于真机任务成功率。</text>
  <g stroke="#cfdbde" stroke-width="1.5">
    <line x1="105" y1="170" x2="1130" y2="170"/><line x1="105" y1="260" x2="1130" y2="260"/>
    <line x1="105" y1="350" x2="1130" y2="350"/><line x1="105" y1="440" x2="1130" y2="440"/><line x1="105" y1="530" x2="1130" y2="530"/>
  </g>
  <g class="t s" text-anchor="end">
    <text x="90" y="176">30</text><text x="90" y="266">10</text><text x="90" y="356">3</text><text x="90" y="446">1</text><text x="90" y="536">0.1</text>
  </g>
  <line x1="105" y1="486" x2="1130" y2="486" stroke="#d2802d" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1120" y="478" text-anchor="end" class="t s" fill="#b66b21">验收阈值 0.5</text>
  <polyline points="125,201 238,276 354,423 476,451 620,479 978,522 1095,529" fill="none" stroke="url(#line)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fff" stroke="#6558c4" stroke-width="4">
    <circle cx="125" cy="201" r="9"/><circle cx="238" cy="276" r="9"/><circle cx="354" cy="423" r="9"/>
    <circle cx="476" cy="451" r="9"/><circle cx="620" cy="479" r="9"/><circle cx="978" cy="522" r="9"/><circle cx="1095" cy="529" r="9"/>
  </g>
  <g class="t v">
    <text x="138" y="190">21.3977</text><text x="250" y="267">6.9405</text><text x="366" y="414">0.7065</text>
    <text x="488" y="442">0.4493</text><text x="632" y="470">0.3369</text><text x="915" y="512">0.1672</text><text x="1018" y="562">0.1628</text>
  </g>
  <g class="t s" text-anchor="middle">
    <text x="125" y="596">0</text><text x="238" y="596">100</text><text x="354" y="596">200</text>
    <text x="476" y="596">400</text><text x="620" y="596">1000</text><text x="978" y="596">10000</text><text x="1095" y="596">11999</text>
  </g>
  <text x="620" y="632" text-anchor="middle" class="t s">训练 step</text>
</svg>
