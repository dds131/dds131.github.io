<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">openpi-RLT RM75 实机项目封面</title>
  <desc id="desc">从三相机和机器人状态，经冻结的 VLA 与 RL Token，到在线 Actor-Critic 和真机动作的工程流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071822"/>
      <stop offset=".48" stop-color="#0b3038"/>
      <stop offset="1" stop-color="#1b2449"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6fe6d4"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="135" r="260" fill="#8b7cff" opacity=".08"/>
  <circle cx="280" cy="820" r="330" fill="#35d0ba" opacity=".07"/>
  <g opacity=".14" stroke="#b9fff4" stroke-width="1">
    <path d="M80 150H1520M80 300H1520M80 450H1520M80 600H1520M80 750H1520"/>
    <path d="M200 80V820M440 80V820M680 80V820M920 80V820M1160 80V820M1400 80V820"/>
  </g>
  <text x="110" y="155" fill="#dffcf7" font-family="system-ui,sans-serif" font-size="44" font-weight="750" letter-spacing="4">OPENPI · RLT · RM75</text>
  <text x="110" y="232" fill="#ffffff" font-family="system-ui,sans-serif" font-size="74" font-weight="800">实机在线强化学习</text>
  <text x="112" y="286" fill="#b9d7dc" font-family="system-ui,sans-serif" font-size="28">冻结大 VLA，以 RL Token 与轻量 Actor-Critic 改进精密操作</text>
  <g transform="translate(110 395)" font-family="system-ui,sans-serif">
    <rect width="310" height="190" rx="28" fill="#0e2630" stroke="#35d0ba" stroke-width="3"/>
    <text x="28" y="52" fill="#7af2df" font-size="22" font-weight="700">01 · 视觉与状态</text>
    <text x="28" y="95" fill="#fff" font-size="34" font-weight="760">三相机 + 8 维</text>
    <text x="28" y="137" fill="#a9c7cd" font-size="22">真实机器人观测</text>
    <text x="28" y="169" fill="#a9c7cd" font-size="22">与 VLA 参考动作</text>
    <path d="M320 95H420" stroke="#6fe6d4" stroke-width="5" marker-end="url(#arr)" filter="url(#glow)"/>
    <g transform="translate(440)">
      <rect width="360" height="190" rx="28" fill="#18243f" stroke="#8b7cff" stroke-width="3"/>
      <text x="28" y="52" fill="#aaa2ff" font-size="22" font-weight="700">02 · 冻结特征服务</text>
      <text x="28" y="95" fill="#fff" font-size="34" font-weight="760">π0.5 + RL Token</text>
      <text x="28" y="137" fill="#bfc2df" font-size="22">z_rl[2048]</text>
      <text x="28" y="169" fill="#bfc2df" font-size="22">ref_chunk[50,8]</text>
      <path d="M370 95H470" stroke="#8b7cff" stroke-width="5" marker-end="url(#arr)" filter="url(#glow)"/>
    </g>
    <g transform="translate(930)">
      <rect width="360" height="190" rx="28" fill="#102b31" stroke="url(#accent)" stroke-width="3"/>
      <text x="28" y="52" fill="#7af2df" font-size="22" font-weight="700">03 · 在线策略</text>
      <text x="28" y="95" fill="#fff" font-size="34" font-weight="760">Actor + Twin Critic</text>
      <text x="28" y="137" fill="#b6d5d4" font-size="22">约 230 万参数</text>
      <text x="28" y="169" fill="#b6d5d4" font-size="22">10 × 8 修正动作块</text>
    </g>
  </g>
  <g transform="translate(110 690)" font-family="system-ui,sans-serif">
    <rect width="1380" height="100" rx="22" fill="#071117" opacity=".86" stroke="#6fe6d4" stroke-opacity=".35"/>
    <text x="34" y="43" fill="#ffffff" font-size="25" font-weight="700">工程结论</text>
    <text x="34" y="76" fill="#bcd4d8" font-size="23">三阶段与安全闭环完整跑通；在线训练健康，但精密插装成功率没有提升。</text>
    <text x="1210" y="62" fill="#ffca6d" font-size="32" font-weight="800">诚实复盘</text>
  </g>
</svg>
