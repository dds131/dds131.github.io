<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">RM75 在线 RLT 系统拓扑</title>
  <desc id="desc">冻结特征服务、在线学习服务、rollout、真机控制与人工介入之间的数据流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbfa"/><stop offset="1" stop-color="#f3f1fb"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#355d65"/></marker>
    <style>.t{font-family:system-ui,sans-serif;fill:#17313a}.h{font-size:27px;font-weight:760}.s{font-size:19px}.m{font-size:17px;fill:#536a71}.lane{font-size:18px;font-weight:750;letter-spacing:2px}.box{fill:#fff;stroke-width:2.6}</style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" class="t" font-size="34" font-weight="780">在线 RLT：三条隔离泳道与一条证据闭环</text>
  <g>
    <rect x="55" y="108" width="1290" height="188" rx="24" fill="#e8f7f4" stroke="#7ccbbf"/>
    <text x="86" y="145" class="t lane" fill="#087e72">冻结大模型域</text>
    <rect x="165" y="166" width="350" height="92" rx="18" class="box" stroke="#1f9d90"/>
    <text x="340" y="204" text-anchor="middle" class="t h">三相机 + 8 维状态</text>
    <text x="340" y="235" text-anchor="middle" class="t m">观测与语言任务</text>
    <path d="M530 212H665" stroke="#355d65" stroke-width="4" marker-end="url(#a)"/>
    <rect x="680" y="150" width="470" height="126" rx="18" class="box" stroke="#6657c8"/>
    <text x="915" y="194" text-anchor="middle" class="t h">冻结 π0.5 + Token Encoder</text>
    <text x="915" y="230" text-anchor="middle" class="t s">z_rl[2048] · ref_chunk[50,8]</text>
  </g>
  <g>
    <rect x="55" y="324" width="1290" height="238" rx="24" fill="#f1effd" stroke="#b3a9e8"/>
    <text x="86" y="362" class="t lane" fill="#5d51b2">在线学习域</text>
    <rect x="105" y="397" width="310" height="112" rx="18" class="box" stroke="#7668ce"/>
    <text x="260" y="439" text-anchor="middle" class="t h">Actor Service</text>
    <text x="260" y="475" text-anchor="middle" class="t m">输出完整 10 × 8 动作块</text>
    <rect x="545" y="397" width="310" height="112" rx="18" class="box" stroke="#7668ce"/>
    <text x="700" y="439" text-anchor="middle" class="t h">Replay Manager</text>
    <text x="700" y="475" text-anchor="middle" class="t m">来源、奖励、丢段与 journal</text>
    <rect x="985" y="397" width="310" height="112" rx="18" class="box" stroke="#7668ce"/>
    <text x="1140" y="439" text-anchor="middle" class="t h">Learner</text>
    <text x="1140" y="475" text-anchor="middle" class="t m">Actor + Twin Critic · UTD 5</text>
    <path d="M870 453H970" stroke="#355d65" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1135 520C1040 570 400 570 275 520" stroke="#355d65" stroke-width="4" fill="none" marker-end="url(#a)"/>
  </g>
  <g>
    <rect x="55" y="590" width="1290" height="206" rx="24" fill="#fff4e8" stroke="#e5b170"/>
    <text x="86" y="629" class="t lane" fill="#b5651b">真机与人工域</text>
    <rect x="120" y="660" width="320" height="98" rx="18" class="box" stroke="#cf7b2d"/>
    <text x="280" y="701" text-anchor="middle" class="t h">Rollout Driver</text>
    <text x="280" y="734" text-anchor="middle" class="t m">构建 transition 与 episode</text>
    <rect x="540" y="660" width="320" height="98" rx="18" class="box" stroke="#cf7b2d"/>
    <text x="700" y="701" text-anchor="middle" class="t h">唯一控制端</text>
    <text x="700" y="734" text-anchor="middle" class="t m">安全闸 · 状态机 · 夹爪</text>
    <rect x="960" y="660" width="320" height="98" rx="18" class="box" stroke="#cf7b2d"/>
    <text x="1120" y="701" text-anchor="middle" class="t h">机器人 + VR 接管</text>
    <text x="1120" y="734" text-anchor="middle" class="t m">人工纠正与稀疏结果信号</text>
    <path d="M450 709H525" stroke="#355d65" stroke-width="4" marker-end="url(#a)"/>
    <path d="M870 709H945" stroke="#355d65" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <path d="M915 290V370H295V390" stroke="#1f9d90" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M260 510V630" stroke="#6657c8" stroke-width="4" marker-end="url(#a)"/>
  <path d="M1120 650V570H700V525" stroke="#c87420" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="1165" y="581" class="t m">transition / reward / HUMAN</text>
</svg>
