<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">RLT 实机项目结果矩阵</title>
  <desc id="desc">将工程链路、表征训练、数据质量、在线训练、正式基线和成功率增益分别判定，突出前四项通过但后两项缺失或失败。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fafb"/><stop offset="1" stop-color="#f5f1fa"/></linearGradient>
    <style>.t{font-family:system-ui,sans-serif;fill:#17313a}.h{font-size:34px;font-weight:790}.k{font-size:25px;font-weight:760}.s{font-size:18px;fill:#586c72}.n{font-size:42px;font-weight:820}</style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="t h">结果矩阵：把“系统跑通”与“策略有效”分开验收</text>
  <text x="70" y="110" class="t s">绿色代表该层证据充分；橙色代表口径或基线不完整；红色代表预设目标没有达到。</text>
  <g transform="translate(70 155)">
    <rect width="390" height="170" rx="22" fill="#e8f6f1" stroke="#2e9e7f" stroke-width="3"/>
    <text x="28" y="46" class="t k">工程链路</text><text x="28" y="105" class="t n" fill="#168967">完成</text>
    <text x="28" y="142" class="t s">分级 dryrun、真机闭环、回放与热更新</text>
  </g>
  <g transform="translate(505 155)">
    <rect width="390" height="170" rx="22" fill="#e8f6f1" stroke="#2e9e7f" stroke-width="3"/>
    <text x="28" y="46" class="t k">RL-Token 表征</text><text x="28" y="105" class="t n" fill="#168967">0.1628</text>
    <text x="28" y="142" class="t s">MSE 通过；VLA 51/51 张量未变</text>
  </g>
  <g transform="translate(940 155)">
    <rect width="390" height="170" rx="22" fill="#e8f6f1" stroke="#2e9e7f" stroke-width="3"/>
    <text x="28" y="46" class="t k">数据与安全</text><text x="28" y="105" class="t n" fill="#168967">100%</text>
    <text x="28" y="142" class="t s">L4 种子原始输出通过 G 闸</text>
  </g>
  <g transform="translate(70 370)">
    <rect width="390" height="170" rx="22" fill="#e8f6f1" stroke="#2e9e7f" stroke-width="3"/>
    <text x="28" y="46" class="t k">在线训练健康</text><text x="28" y="105" class="t n" fill="#168967">UTD 吻合</text>
    <text x="28" y="142" class="t s">critic 稳定；数据闸与丢段生效</text>
  </g>
  <g transform="translate(505 370)">
    <rect width="390" height="170" rx="22" fill="#fff3dd" stroke="#d08a2d" stroke-width="3"/>
    <text x="28" y="46" class="t k">正式零接管基线</text><text x="28" y="105" class="t n" fill="#bd7620">缺失</text>
    <text x="28" y="142" class="t s">L4.0 首轮因口径不统一作废</text>
  </g>
  <g transform="translate(940 370)">
    <rect width="390" height="170" rx="22" fill="#fde9e7" stroke="#cb5b50" stroke-width="3"/>
    <text x="28" y="46" class="t k">成功率增益</text><text x="28" y="105" class="t n" fill="#b64840">未实现</text>
    <text x="28" y="142" class="t s">能抓能搬；精密插装仍失败</text>
  </g>
  <g transform="translate(70 600)">
    <rect width="1260" height="150" rx="24" fill="#172c35"/>
    <text x="34" y="48" class="t" fill="#fff" font-size="26" font-weight="760">最关键的未通过判据</text>
    <text x="34" y="94" class="t" fill="#fff" font-size="24">末段 20% 人工介入占比：实际最好 23.1%</text>
    <rect x="790" y="70" width="395" height="22" rx="11" fill="#43535a"/>
    <rect x="790" y="70" width="228" height="22" rx="11" fill="#f0a448"/>
    <line x1="1185" y1="58" x2="1185" y2="105" stroke="#fff" stroke-width="3"/>
    <text x="1185" y="129" text-anchor="middle" class="t" fill="#fff" font-size="18">目标 &gt; 40%</text>
  </g>
</svg>
