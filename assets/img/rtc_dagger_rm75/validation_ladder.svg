<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">RTC DAgger 验证阶梯</title><desc id="desc">从纯逻辑自测到真机完整闭环 A/B 的验证层级，前五层已完成，后两层待执行</desc>
  <style>.t{font:750 17px system-ui,sans-serif;fill:#17313b}.s{font:13px system-ui,sans-serif;fill:#536a74}.ok{fill:#e8f7f2;stroke:#0e9384;stroke-width:2}.mid{fill:#fff7e9;stroke:#d18b25;stroke-width:2}.n{font:800 14px system-ui,sans-serif;fill:white}.pillok{fill:#0e9384}.pillmid{fill:#d18b25}</style>
  <rect width="1080" height="520" rx="22" fill="#f8fbfb"/>
  <g transform="translate(70,410)"><rect class="ok" width="210" height="64" rx="12"/><text class="t" x="20" y="29">1 · FSM / Mock</text><text class="s" x="20" y="50">相位、门控、误按</text><rect class="pillok" x="158" y="13" width="38" height="22" rx="11"/><text class="n" x="177" y="29" text-anchor="middle">过</text></g>
  <g transform="translate(180,342)"><rect class="ok" width="230" height="64" rx="12"/><text class="t" x="20" y="29">2 · 导入与模块自测</text><text class="s" x="20" y="50">依赖链、记录器、IK</text><rect class="pillok" x="178" y="13" width="38" height="22" rx="11"/><text class="n" x="197" y="29" text-anchor="middle">过</text></g>
  <g transform="translate(290,274)"><rect class="ok" width="250" height="64" rx="12"/><text class="t" x="20" y="29">3 · 自动化 Dry-run</text><text class="s" x="20" y="50">RTC→接管→保存→复位</text><rect class="pillok" x="198" y="13" width="38" height="22" rx="11"/><text class="n" x="217" y="29" text-anchor="middle">过</text></g>
  <g transform="translate(400,206)"><rect class="ok" width="270" height="64" rx="12"/><text class="t" x="20" y="29">4 · Schema / 传输</text><text class="s" x="20" y="50">逐字段校验、摘要一致</text><rect class="pillok" x="218" y="13" width="38" height="22" rx="11"/><text class="n" x="237" y="29" text-anchor="middle">过</text></g>
  <g transform="translate(510,138)"><rect class="ok" width="290" height="64" rx="12"/><text class="t" x="20" y="29">5 · 聚合与训练冒烟</text><text class="s" x="20" y="50">两步更新、checkpoint 落盘</text><rect class="pillok" x="238" y="13" width="38" height="22" rx="11"/><text class="n" x="257" y="29" text-anchor="middle">过</text></g>
  <g transform="translate(620,70)"><rect class="mid" width="310" height="64" rx="12"/><text class="t" x="20" y="29">6 · 真 VR / 低速真机</text><text class="s" x="20" y="50">键值、离合、安全裕量</text><rect class="pillmid" x="246" y="13" width="50" height="22" rx="11"/><text class="n" x="271" y="29" text-anchor="middle">待</text></g>
  <g transform="translate(730,2)"><rect class="mid" width="300" height="64" rx="12"/><text class="t" x="20" y="29">7 · 完整闭环与 A/B</text><text class="s" x="20" y="50">零接管成功率、保持集</text><rect class="pillmid" x="236" y="13" width="50" height="22" rx="11"/><text class="n" x="261" y="29" text-anchor="middle">待</text></g>
  <path d="M55 487H1025" stroke="#bccacc" stroke-width="1.5" stroke-dasharray="6 6"/><text class="s" x="540" y="510" text-anchor="middle">每一级只授权进入下一层；低层通过不能替代真机性能证据</text>
</svg>

