<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
  <title id="title">RTC 自主到 VR 接管的五相位状态机</title><desc id="desc">IDLE、AUTO、SOFT STOP、HANDOFF、TELEOP 五相位以及记录门控</desc>
  <defs><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#62757d"/></marker></defs>
  <style>.t{font:750 18px system-ui,sans-serif;fill:#17313b}.s{font:13px system-ui,sans-serif;fill:#536a74}.b{fill:#fff;stroke:#9eb2b8;stroke-width:2}.g{stroke:#0e9384;stroke-width:3}.o{stroke:#d18b25;stroke-width:3}.p{stroke:#5865d8;stroke-width:3}.a{fill:none;stroke:#62757d;stroke-width:2;marker-end:url(#sa)}.dash{stroke-dasharray:6 5}.band{fill:#edf7f5;stroke:#badbd5}</style>
  <rect width="1060" height="430" rx="22" fill="#f8fbfb"/>
  <g><rect class="b" x="40" y="125" width="150" height="96" rx="15"/><text class="t" x="115" y="163" text-anchor="middle">IDLE</text><text class="s" x="115" y="190" text-anchor="middle">默认不动</text>
  <rect class="b g" x="245" y="125" width="150" height="96" rx="15"/><text class="t" x="320" y="163" text-anchor="middle">AUTO</text><text class="s" x="320" y="190" text-anchor="middle">RTC 自主执行</text>
  <rect class="b o" x="450" y="125" width="150" height="96" rx="15"/><text class="t" x="525" y="163" text-anchor="middle">SOFT STOP</text><text class="s" x="525" y="190" text-anchor="middle">限加速度减速</text>
  <rect class="b o" x="655" y="125" width="150" height="96" rx="15"/><text class="t" x="730" y="163" text-anchor="middle">HANDOFF</text><text class="s" x="730" y="190" text-anchor="middle">停稳 · 等待握持</text>
  <rect class="b p" x="860" y="125" width="160" height="96" rx="15"/><text class="t" x="940" y="163" text-anchor="middle">TELEOP</text><text class="s" x="940" y="190" text-anchor="middle">VR→IK→安全链</text></g>
  <path class="a" d="M190 173h50"/><path class="a" d="M395 173h50"/><path class="a" d="M600 173h50"/><path class="a" d="M805 173h50"/>
  <text class="s" x="217" y="150" text-anchor="middle">开始</text><text class="s" x="422" y="150" text-anchor="middle">风险</text><text class="s" x="627" y="150" text-anchor="middle">停稳</text><text class="s" x="832" y="150" text-anchor="middle">Grip</text>
  <rect class="band" x="695" y="278" width="325" height="90" rx="14"/><text class="t" x="857" y="309" text-anchor="middle">记录条件</text><text class="s" x="857" y="338" text-anchor="middle">TELEOP ∧ ARMED ∧ Grip ∧ ACTIVE</text><text class="s" x="857" y="358" text-anchor="middle">松开 Grip：机械臂冻结，当前帧不记录</text>
  <path class="a dash" d="M940 221v52"/>
  <path class="a dash" d="M940 125C940 48 116 48 116 120"/><text class="s" x="532" y="48" text-anchor="middle">正常结束 / 故障 / 未保存退出：清理临时状态并返回 IDLE</text>
</svg>

